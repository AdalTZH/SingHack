<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat Assistant</title>
    <script>
      // Bridge script to handle insurance prompts from decision agent
      // This listens for master agent responses and dispatches custom events
      (function() {
        if (typeof chrome !== 'undefined' && chrome.runtime) {
          chrome.runtime.onMessage.addListener((request, sender, sendResponse) => {
            if (request.type === 'insurancePromptFromAgent' && request.message) {
              // Dispatch custom event that React app should listen for
              const event = new CustomEvent('insurancePromptFromAgent', {
                detail: {
                  message: request.message, // Master agent's response
                  url: request.url,
                  title: request.title,
                  travel_context: request.travel_context,
                  timestamp: request.timestamp
                }
              });
              window.dispatchEvent(event);
            }
          });
        }
      })();
    </script>
    <script type="module" crossorigin src="./sidepanel.js"></script>
    <link rel="stylesheet" crossorigin href="./main.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
