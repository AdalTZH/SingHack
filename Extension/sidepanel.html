<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat Assistant</title>
    <script>
      // Bridge script to handle insurance prompts from decision agent
      // This listens for master agent responses and tries to inject them into the React chat app
      (function() {
        if (typeof chrome !== 'undefined' && chrome.runtime) {
          // Listen for messages from background script
          chrome.runtime.onMessage.addListener((request, sender, sendResponse) => {
            if (request.type === 'insurancePromptFromAgent' && request.message) {
              // Wait for React app to load, then try to inject the message
              const injectMessage = () => {
                // Try multiple strategies to add message to chat
                
                // Strategy 1: Dispatch custom event
                const event = new CustomEvent('insurancePromptFromAgent', {
                  detail: {
                    message: request.message,
                    url: request.url,
                    title: request.title,
                    travel_context: request.travel_context,
                    timestamp: request.timestamp
                  }
                });
                window.dispatchEvent(event);
                
                // Strategy 2: Try to find React root and trigger message handler
                // This assumes the React app has a global message handler or state setter
                setTimeout(() => {
                  // Look for React devtools hook
                  if (window.__REACT_DEVTOOLS_GLOBAL_HOOK__) {
                    const roots = window.__REACT_DEVTOOLS_GLOBAL_HOOK__.renderers;
                    if (roots && roots.size > 0) {
                      // React app is loaded, try to trigger message
                      const event2 = new CustomEvent('addChatMessage', {
                        detail: {
                          text: request.message,
                          sender: 'assistant'
                        }
                      });
                      window.dispatchEvent(event2);
                    }
                  }
                }, 1000);
              };
              
              // If DOM is ready, inject immediately, otherwise wait
              if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', injectMessage);
              } else {
                // Wait a bit for React to load
                setTimeout(injectMessage, 500);
              }
            }
          });
        }
      })();
    </script>
    <script type="module" crossorigin src="./sidepanel.js"></script>
    <link rel="stylesheet" crossorigin href="./main.css">
    <!-- Chat UI Fix - Prevents message overlap with input field -->
    <link rel="stylesheet" href="./chat-fix.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
